<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>너는 쌍떡잎이니? 외떡잎이니?</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; }
        h1 { color: #2c3e50; font-size: 24px; }
        p { color: #555; }
        #image-preview { max-width: 300px; max-height: 300px; margin: 20px auto; border-radius: 10px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .upload-btn { background-color: #27ae60; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; display: inline-block; margin-top: 10px; font-weight: bold; }
        #label-container { margin-top: 20px; font-size: 18px; font-weight: bold; }
        .bar-container { width: 100%; max-width: 350px; background-color: #ddd; margin: 5px auto 15px auto; border-radius: 10px; overflow: hidden; }
        .bar { height: 24px; background-color: #3498db; width: 0%; text-align: right; padding-right: 10px; box-sizing: border-box; color: white; font-size: 14px; line-height: 24px; transition: width 0.5s ease; }
        .unknown-msg { color: #e74c3c; font-size: 20px; margin-top: 15px; font-weight: bold; padding: 10px; border: 2px dashed #e74c3c; border-radius: 8px; max-width: 300px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <h1>🌿 너는 쌍떡잎이니? 외떡잎이니?</h1>
    <p>잎 사진을 올리면 그물맥/나란히맥을 분석해 종류를 알려줍니다.</p>

    <input type="file" id="image-upload" accept="image/*" style="display: none;" onchange="previewAndPredict(event)">
    <label for="image-upload" class="upload-btn">📷 사진 업로드하기</label>

    <br>
    <img id="image-preview" src="" alt="미리보기">

    <div id="label-container">AI 모델을 불러오는 중입니다... 잠시만 기다려주세요.</div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/custom-teachablemachine-image.min.js"></script>

    <script>
        let model;
        let labelContainer;
        let maxPredictions;

        function setStatus(message) {
            const container = document.getElementById("label-container");
            if (container) container.innerHTML = message;
        }

        async function init() {
            try {
                const MODEL_URL = "./model/";
                model = await tmImage.load(
                    MODEL_URL + "model.json",
                    MODEL_URL + "metadata.json"
                );

                maxPredictions = model.getTotalClasses();
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "✨ 로딩 완료! 사진을 업로드해보세요.";
            } catch (error) {
                console.error("모델 로딩 실패:", error);
                setStatus("❌ AI 모델 로딩에 실패했습니다.<br>모델 경로와 파일 구조를 다시 확인해 주세요.");
            }
        }

        async function previewAndPredict(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const imgElement = document.getElementById("image-preview");
                imgElement.src = e.target.result;
                imgElement.style.display = "block";

                setStatus("🔍 분석 중입니다...");

                imgElement.onload = async function() {
                    try {
                        if (!model) {
                            setStatus("❌ 모델이 아직 준비되지 않았습니다.");
                            return;
                        }

                        const prediction = await model.predict(imgElement);
                        labelContainer.innerHTML = "";

                        let maxProb = 0;

                        for (let i = 0; i < maxPredictions; i++) {
                            const className = prediction[i].className;
                            const probability = prediction[i].probability;
                            const probPercent = (probability * 100).toFixed(1);

                            if (probability > maxProb) maxProb = probability;

                            const resultHtml = `
                                <div style="text-align: left; max-width: 350px; margin: 0 auto;">
                                    <span>${className}</span>
                                </div>
                                <div class="bar-container">
                                    <div class="bar" style="width: ${probPercent}%">${probPercent}%</div>
                                </div>
                            `;
                            labelContainer.innerHTML += resultHtml;
                        }

                        if (maxProb < 0.7) {
                            labelContainer.innerHTML += `<div class="unknown-msg">🤔 특징이 모호하여<br>잘 모르겠어요!</div>`;
                        }
                    } catch (error) {
                        console.error("예측 실패:", error);
                        setStatus("❌ 이미지 분석 중 오류가 발생했습니다.");
                    }
                };
            };
            reader.readAsDataURL(file);
        }

        init();
    </script>
</body>
</html>
