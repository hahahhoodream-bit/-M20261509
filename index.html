<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잎맥 탐험대 | 쌍떡잎? 외떡잎?</title>
    <style>
        :root {
            color-scheme: light;
            --green: #23845b;
            --green-dark: #176345;
            --ink: #263b32;
            --muted: #6d7f75;
            --paper: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 18px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            text-align: center;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 12%, rgba(181, 222, 181, .45), transparent 28%),
                radial-gradient(circle at 90% 85%, rgba(255, 224, 168, .4), transparent 25%),
                #f2f7f1;
        }

        .card {
            width: min(100%, 620px);
            padding: 38px 28px 34px;
            background: rgba(255, 255, 255, .94);
            border: 1px solid rgba(35, 132, 91, .12);
            border-radius: 28px;
            box-shadow: 0 18px 50px rgba(44, 78, 55, .12);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .12em;
        }

        h1 { margin: 0; color: #234b39; font-size: clamp(24px, 5vw, 32px); line-height: 1.35; }
        .intro { margin: 12px 0 24px; color: var(--muted); line-height: 1.7; }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 50px;
            padding: 0 24px;
            color: #fff;
            background: linear-gradient(135deg, #31a66f, #218054);
            border-radius: 15px;
            box-shadow: 0 7px 16px rgba(35, 132, 91, .22);
            cursor: pointer;
            font-size: 16px;
            font-weight: 750;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(35, 132, 91, .28); }
        .upload-btn:focus-within, #image-upload:focus + .upload-btn { outline: 3px solid #f3c969; outline-offset: 3px; }

        #image-preview {
            display: none;
            max-width: min(100%, 360px);
            max-height: 360px;
            margin: 26px auto 10px;
            border: 5px solid #fff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(35, 62, 45, .16);
            object-fit: contain;
        }

        #label-container {
            margin-top: 24px;
            font-size: 16px;
            font-weight: 650;
            line-height: 1.6;
        }

        .status-message { color: #60766a; }
        .prediction-list { margin-top: 18px; }
        .prediction-name { max-width: 380px; margin: 12px auto 5px; text-align: left; color: #385448; font-size: 15px; font-weight: 750; }
        .prediction-row { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 380px; margin: 0 auto 15px; }
        .bar-container { flex: 1; height: 14px; overflow: hidden; background: #e8eee8; border-radius: 99px; }
        .bar { height: 100%; min-width: 0; color: transparent; background: linear-gradient(90deg, #70c68e, #25865b); border-radius: inherit; transition: width .5s ease; }
        .probability-label { flex: 0 0 52px; text-align: right; color: #385448; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }

        .result-msg {
            width: min(100%, 430px);
            margin: 22px auto 0;
            padding: 16px 18px;
            color: #1c6846;
            background: #eaf7ed;
            border: 1px solid #bfe3c7;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
        }

        .result-tip {
            width: min(100%, 430px);
            margin: 12px auto 0;
            padding: 14px 16px;
            color: #74521b;
            background: #fff6df;
            border: 1px solid #f0d48d;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 750;
        }

        .unknown-msg {
            width: min(100%, 430px);
            margin: 18px auto 0;
            padding: 15px;
            color: #a64b37;
            background: #fff1eb;
            border: 1px solid #f2c2b1;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
        }

        .err-detail { color: #8d5b50; font-size: 13px; font-weight: 500; }

        @media (max-width: 480px) {
            body { padding: 24px 12px; }
            .card { padding: 30px 18px 26px; border-radius: 22px; }
            .intro { font-size: 14px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">🌱 LEAF VEIN EXPLORER</p>
        <h1>너는 쌍떡잎이니?<br>외떡잎이니?</h1>
        <p class="intro">잎 사진을 올리면 식물의 종류를 알려드려요.</p>

        <input type="file" id="image-upload" accept="image/*" style="display: none;" onchange="previewAndPredict(event)">
        <label for="image-upload" class="upload-btn">📷 사진 업로드하기</label>

        <img id="image-preview" src="" alt="업로드한 잎 사진 미리보기">
        <div id="label-container"><span class="status-message">AI 모델을 불러오는 중입니다. 잠시만 기다려주세요.</span></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

    <script>
        let model = null;
        let maxPredictions = 0;

        function setStatus(message) {
            document.getElementById("label-container").innerHTML = message;
        }

        async function init() {
            try {
                if (typeof tmImage === "undefined") {
                    throw new Error("Teachable Machine 라이브러리를 불러오지 못했습니다. (인터넷 연결 또는 스크립트 주소 확인)");
                }
                const MODEL_URL = "./model/";
                model = await tmImage.load(
                    MODEL_URL + "model.json",
                    MODEL_URL + "metadata.json"
                );
                maxPredictions = model.getTotalClasses();
                setStatus("<span class='status-message'>✨ 준비 완료! 잎 사진을 업로드해보세요.</span>");
            } catch (error) {
                console.error("모델 로딩 실패:", error);
                setStatus("❌ AI 모델 로딩에 실패했습니다.<br><span class='err-detail'>" + error.message + "</span>");
            }
        }

        function previewAndPredict(event) {
            const input = event.target;
            const file = input.files[0];
            if (!file) return;

            if (!model) {
                setStatus("❌ 모델이 아직 준비되지 않았습니다. 잠시 후 다시 시도해 주세요.");
                input.value = "";
                return;
            }

            const imgElement = document.getElementById("image-preview");
            setStatus("<span class='status-message'>🔍 잎맥을 살펴보고 있어요...</span>");

            imgElement.onload = async function () {
                try {
                    const prediction = await model.predict(imgElement);
                    let html = "<div class='prediction-list'>";
                    let maxProb = 0;
                    let topClassName = "";

                    for (let i = 0; i < maxPredictions; i++) {
                        const probability = prediction[i].probability;
                        const probPercent = (probability * 100).toFixed(1);
                        if (probability > maxProb) {
                            maxProb = probability;
                            topClassName = prediction[i].className;
                        }

                        html += `
                            <div class="prediction-name">${prediction[i].className}</div>
                            <div class="prediction-row">
                                <div class="bar-container" role="img" aria-label="${prediction[i].className}: ${probPercent}%">
                                    <div class="bar" style="width: ${probPercent}%"></div>
                                </div>
                                <span class="probability-label">${probPercent}%</span>
                            </div>`;
                    }
                    html += "</div>";

                    if (maxProb < 0.7) {
                        html += `<div class="unknown-msg">🤔 특징이 모호하여 잘 모르겠어요!</div>`;
                    } else if (topClassName.includes("쌍떡잎")) {
                        html += `<div class="result-msg">🌿 쌍떡잎식물은 그물맥의 형태를 갖고있어요!</div>`;
                    } else if (topClassName.includes("외떡잎")) {
                        html += `<div class="result-msg">🌾 외떡잎식물은 나란히맥의 형태를 갖고있어요!</div>`;
                    }

                    html += `<div class="result-tip">🔎 잎맥의 형태를 다시 한번 살펴보아요!</div>`;
                    setStatus(html);
                } catch (error) {
                    console.error("예측 실패:", error);
                    setStatus("❌ 이미지 분석 중 오류가 발생했습니다.<br><span class='err-detail'>" + error.message + "</span>");
                }
            };

            imgElement.onerror = function () {
                setStatus("❌ 이미지를 불러오지 못했습니다. 다른 사진을 선택해 주세요.");
            };

            imgElement.style.display = "block";
            imgElement.src = URL.createObjectURL(file);
            input.value = "";
        }

        init();
    </script>
</body>
</html>
