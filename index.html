<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생용 / 교사용 선택</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --line: #dfe3e8;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            color: var(--text);
        }

        .panel {
            width: min(640px, calc(100% - 32px));
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 32px 24px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 3vw, 38px);
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border-radius: 10px;
            padding: 15px 28px;
            font-size: 17px;
            font-weight: 700;
            transition: 0.2s ease;
            min-width: 220px;
        }

        .btn.primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.2);
        }

        .btn.primary:hover {
            background: var(--primary-dark);
        }

        .btn.secondary {
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #cfe0ff;
        }

        .btn.secondary:hover {
            background: #e0edff;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>너는 쌍떡잎이니? 외떡잎이니?</h1>
        <p>사용할 화면을 선택해 주세요.</p>

        <div class="buttons">
            <a class="btn primary" href="./student.html">학생용 앱 열기</a>
            <a class="btn secondary" href="./teacher.html">교사용 평가 페이지</a>
        </div>
    </div>
</body>
</html>
