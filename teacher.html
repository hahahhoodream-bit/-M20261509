<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교사용 평가 화면</title>
  <style>
    :root{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--line:#d7e1ee;--ink:#172b44;--blue:#10477f;--blue-dark:#0b3b70;--muted:#718096;--ok:#e8f6ed;--bad:#fde4e4}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR',Arial,sans-serif}
    .page{max-width:1180px;margin:0 auto;padding:28px 20px 40px}.topbar{margin:0 0 22px}.topbar h1{margin:0;color:var(--blue-dark);font-size:clamp(26px,4vw,38px)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 5px 16px rgba(20,50,80,.05)}
    .panel h2{margin:0 0 16px;font-size:21px;color:#174b78}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.controls input{max-width:100%}button{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}button.secondary{background:#edf2f7;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:not-allowed}
    .hint,.status{font-size:14px;line-height:1.6;color:var(--muted);margin:12px 0 0}.accuracy{margin-top:16px;font-size:15px}.accuracy strong{display:block;color:var(--blue);font-size:32px;margin-top:3px}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table.matrix{width:100%;min-width:450px;border-collapse:collapse;table-layout:auto;font-size:16px}table.matrix th,table.matrix td{border:1px solid var(--line);padding:13px 12px;text-align:center}table.matrix thead th{background:var(--blue);color:#fff;font-size:16px;font-weight:750;white-space:nowrap}table.matrix tbody th{color:var(--blue);text-align:left;font-size:16px;white-space:nowrap;background:#fff}table.matrix td{font-size:18px;color:#172b44}table.matrix td.ok{background:var(--ok);font-weight:750}table.matrix td.bad{background:var(--bad);font-weight:750}table.matrix td.zero{background:#fff}
    .bars{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:minmax(90px,130px) 1fr 55px;gap:10px;align-items:center;font-size:14px}.bar-label{overflow-wrap:anywhere;font-weight:700}.track{height:13px;border-radius:10px;background:#e8edf3;overflow:hidden}.fill{height:100%;background:#3479bd}.bar-value{text-align:right;font-weight:700}
    .wrong-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.wrong-card{border:1px solid #e6a3a3;border-radius:10px;padding:7px;background:#fff}.wrong-card img{display:block;width:100%;height:130px;object-fit:contain;background:#f5f7fa}.wrong-card p{margin:7px 0 0;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.empty{padding:14px;color:var(--muted);font-size:14px}.footnote{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.page{padding:20px 12px}.panel{padding:18px}.panel h2{font-size:19px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><h1>교사용 모델 평가 화면</h1></header>
    <div class="grid">
      <section class="panel">
        <h2>1. 테스트 사진 넣기</h2>
        <div class="controls">
          <input id="file-input" type="file" accept="image/*" multiple />
          <button id="run-btn" type="button">모델 성능 평가 실행</button>
          <button id="reset-btn" type="button" class="secondary">초기화</button>
        </div>
        <p class="hint">파일 이름은 클래스명_번호.jpg 형식으로 입력해 주세요. 예: 쌍떡잎식물_01.jpg, 외떡잎식물_01.jpg, background_01.jpg</p>
        <p id="status" class="status">모델을 불러오는 중입니다...</p>
        <div class="accuracy">전체 정확도<strong id="accuracy">0.0% (0/0)</strong></div>
      </section>
      <section class="panel">
        <h2>2. 클래스별 정분류율</h2>
        <div id="bars" class="bars"><div class="empty">모델을 불러오는 중입니다.</div></div>
      </section>
      <section class="panel">
        <h2>3. 혼동행렬 (행: 실제, 열: 예측)</h2>
        <div class="table-wrap"><table class="matrix" id="matrix-table" aria-label="혼동행렬"></table></div>
      </section>
      <section class="panel">
        <h2 id="wrong-title">4. 틀린 사진 모아 보기</h2>
        <div id="wrong-gallery" class="empty">평가가 완료되면 오분류된 사진이 표시됩니다.</div>
      </section>
    </div>
    <p class="footnote">혼동행렬의 행은 실제 클래스, 열은 모델 예측 클래스입니다.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <script>
    const MODEL_URL='./model/';
    const fileInput=document.getElementById('file-input');
    const statusEl=document.getElementById('status');
    const matrixTable=document.getElementById('matrix-table');
    const aliases={
      '쌍떡잎':'쌍떡잎식물','쌍떡잎식물':'쌍떡잎식물','dicot':'쌍떡잎식물','그물맥':'쌍떡잎식물',
      '외떡잎':'외떡잎식물','외떡잎식물':'외떡잎식물','monocot':'외떡잎식물','나란히맥':'외떡잎식물',
      'background':'background','배경':'background'
    };
    let model=null;
    let labels=[];
    let results=[];
    let busy=false;

    function normalize(value){return String(value||'').trim().toLowerCase().replace(/[_\-\s]+/g,'').replace(/[^a-z0-9가-힣]/gi,'')}
    function resolveLabel(raw){
      if(!raw)return null;
      const source=String(raw).trim();
      const alias=aliases[source.toLowerCase()]||aliases[source];
      if(alias){const match=labels.find(label=>normalize(label)===normalize(alias));return match||alias}
      return labels.find(label=>normalize(label)===normalize(source))||null;
    }
    function inferActual(fileName){
      const stem=fileName.replace(/\.[^.]+$/,'');
      const token=(stem.split(/[_\-\s]+/)[0]||'').trim();
      return resolveLabel(token);
    }
    function renderMatrix(){
      const counts=labels.map(()=>labels.map(()=>0));
      results.forEach(result=>{
        const row=labels.findIndex(label=>normalize(label)===normalize(result.actual));
        const col=labels.findIndex(label=>normalize(label)===normalize(result.predicted));
        if(row>=0&&col>=0)counts[row][col]++;
      });
      const thead=document.createElement('thead');
      const header=document.createElement('tr');
      const corner=document.createElement('th');corner.scope='col';corner.textContent='실제 \\ 예측';header.appendChild(corner);
      labels.forEach(label=>{const th=document.createElement('th');th.scope='col';th.textContent=label;header.appendChild(th)});
      thead.appendChild(header);
      const tbody=document.createElement('tbody');
      labels.forEach((label,row)=>{
        const tr=document.createElement('tr');
        const rowHeader=document.createElement('th');rowHeader.scope='row';rowHeader.textContent=label;tr.appendChild(rowHeader);
        labels.forEach((_,col)=>{const td=document.createElement('td');td.textContent=String(counts[row][col]);td.className=row===col?'ok':counts[row][col]>0?'bad':'zero';tr.appendChild(td)});
        tbody.appendChild(tr);
      });
      matrixTable.replaceChildren(thead,tbody);
    }
    function render(){
      renderMatrix();
      const bars=document.getElementById('bars');bars.replaceChildren();
      labels.forEach(label=>{
        const rows=results.filter(item=>normalize(item.actual)===normalize(label));
        const correct=rows.filter(item=>item.ok).length;
        const rate=rows.length?correct/rows.length:0;
        const row=document.createElement('div');row.className='bar-row';
        const name=document.createElement('div');name.className='bar-label';name.textContent=label;
        const track=document.createElement('div');track.className='track';
        const fill=document.createElement('div');fill.className='fill';fill.style.width=(rate*100)+'%';track.appendChild(fill);
        const value=document.createElement('div');value.className='bar-value';value.textContent=rows.length?(rate*100).toFixed(0)+'%':'-';
        row.append(name,track,value);bars.appendChild(row);
      });
      const correct=results.filter(item=>item.ok).length;
      document.getElementById('accuracy').textContent=(results.length?(correct/results.length*100):0).toFixed(1)+'% ('+correct+'/'+results.length+')';
      const wrong=results.filter(item=>!item.ok);
      document.getElementById('wrong-title').textContent='4. 틀린 사진 모아 보기 ('+wrong.length+'장)';
      const gallery=document.getElementById('wrong-gallery');gallery.replaceChildren();
      if(!wrong.length){gallery.className='empty';gallery.textContent=results.length?'오분류된 사진이 없습니다.':'평가가 완료되면 오분류된 사진이 표시됩니다.';return}
      gallery.className='wrong-gallery';
      wrong.forEach(item=>{const card=document.createElement('article');card.className='wrong-card';const img=document.createElement('img');img.src=item.url;img.alt=item.file;const meta=document.createElement('p');meta.textContent=item.file+' · 실제: '+item.actual+' → 예측: '+item.predicted;card.append(img,meta);gallery.appendChild(card)});
    }
    async function init(){
      try{
        if(typeof tmImage==='undefined')throw new Error('Teachable Machine 라이브러리를 불러오지 못했습니다.');
        model=await tmImage.load(MODEL_URL+'model.json',MODEL_URL+'metadata.json');
        labels=model.getClassLabels().map((name,index)=>String(name||'').trim()||'클래스 '+(index+1));
        if(!labels.length)throw new Error('모델 클래스 정보를 찾을 수 없습니다.');
        render();
        statusEl.textContent='모델 로드 완료 · 클래스 '+labels.length+'개: '+labels.join(', ');
      }catch(error){console.error(error);statusEl.textContent='모델 로딩 실패: '+error.message}
    }
    async function runEvaluation(){
      const files=Array.from(fileInput.files||[]);
      if(!model){statusEl.textContent='모델이 아직 준비되지 않았습니다.';return}
      if(!files.length){statusEl.textContent='먼저 테스트 사진을 선택해 주세요.';return}
      if(busy)return;
      busy=true;document.getElementById('run-btn').disabled=true;results=[];render();
      let excluded=[];
      for(const file of files){
        const actual=inferActual(file.name);
        if(!actual){excluded.push(file.name);continue}
        const url=URL.createObjectURL(file);
        try{
          const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('이미지를 열 수 없습니다.'));img.src=url});
          const prediction=await model.predict(image);
          const best=prediction.reduce((top,item)=>item.probability>top.probability?item:top,prediction[0]);
          const predicted=labels.find(label=>normalize(label)===normalize(best.className))||best.className;
          results.push({file:file.name,actual,predicted,probability:best.probability,ok:normalize(actual)===normalize(predicted),url});
        }catch(error){URL.revokeObjectURL(url);excluded.push(file.name);console.error(file.name,error)}
      }
      render();busy=false;document.getElementById('run-btn').disabled=false;
      statusEl.textContent='평가 완료 · 판정 '+results.length+'장'+(excluded.length?' · 제외 '+excluded.length+'장 (클래스명 확인 필요): '+excluded.join(', '):'');
    }
    document.getElementById('run-btn').addEventListener('click',runEvaluation);
    document.getElementById('reset-btn').addEventListener('click',()=>{results.forEach(item=>URL.revokeObjectURL(item.url));results=[];fileInput.value='';statusEl.textContent='초기화했습니다. 사진을 선택한 뒤 평가를 실행해 주세요.';render()});
    init();
  </script>
</body>
</html>
